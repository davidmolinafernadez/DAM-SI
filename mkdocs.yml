site_name: Sistemas Informáticos · 1.º DAM
site_description: Material de consulta y apoyo para la asignatura Sistemas Informáticos
site_url: https://davidmolinafernadez.github.io/DAM-SI/
docs_dir: .site-src
site_dir: site

theme:
  name: material
  language: es
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Activar modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Activar modo claro

plugins:
  - search:
      lang: es

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

nav:
  - Inicio: index.md
  - Tema 1 · Componentes:
      - Presentación: ud1/index.md
      - 1 · Componentes del sistema:
          - Teoría: ud1/01-componentes-sistema-informatico.md
          - Tarea 1.1 · Placa base: ud1/actividades/A1-placa-base.md
          - Tarea 1.2 · Representación numérica: ud1/actividades/A2-representacion-numerica.md
          - Tarea 1.3 · Supercomputador: ud1/actividades/A3-supercomputador.md
      - 1.1 · Instrucciones de la CPU:
          - Teoría: ud1/11-instrucciones-cpu.md
          - Tarea 1.1.1 · Ciclo de instrucción: ud1/actividades/A11-ciclo-instruccion.md
      - 1.2 · Compatibilidad:
          - Teoría: ud1/12-compatibilidad-hardware.md
          - Tarea 1.2.1 · Auditoría: ud1/actividades/A12-compatibilidad.md
      - 1.3 · Alimentación y SAI:
          - Teoría: ud1/13-alimentacion-sai.md
          - Tarea 1.3.1 · Dimensionado: ud1/actividades/A13-sai.md
  - UD2 · Sistemas operativos:
