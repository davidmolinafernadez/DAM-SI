<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Ver el escritorio es solo el comienzo</title><desc id="desc">Preparar. Revisar antes de instalar. Comprueba ISO, recursos y disco virtual de destino. Identifica qué se va a escribir.. Instalar. Leer cada decisión. El entorno Live y el sistema instalado pueden mostrar escritorios parecidos.. Comprobar. Arranque y persistencia. Tras instalar, apaga, retira la ISO y arranca desde el disco. Comprueba tus datos.. La instalación se acepta con pruebas. El escritorio por sí solo no identifica el medio desde el que se ha arrancado.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect width="1200" height="680" rx="24" fill="#f1f5f9"/><path d="M24 0H1176Q1200 0 1200 24V156H0V24Q0 0 24 0" fill="#0f172a"/><text x="42" y="44" font-size="17" fill="#67e8f9" font-weight="600">SISTEMAS INFORMÁTICOS  /  UD3  /  3.3.1</text><text x="42" y="105" font-size="38" fill="#ffffff" font-weight="700">Ver el escritorio es solo el comienzo</text><rect x="42" y="186" width="356" height="336" rx="18" fill="white" stroke="#cbd5e1"/><rect x="42" y="186" width="356" height="8" rx="4" fill="#0284c7"/><circle cx="82" cy="234" r="21" fill="#0284c7"/><text x="75" y="242" font-size="21" fill="white" font-weight="700">1</text><text x="66" y="294" font-size="29" fill="#0f172a" font-weight="700">Preparar</text><text x="66" y="333" font-size="21" fill="#0284c7" font-weight="400">Revisar antes de instalar</text><text x="66" y="394" font-size="22" fill="#475569" font-weight="400">Comprueba ISO, recursos y</text><text x="66" y="426" font-size="22" fill="#475569" font-weight="400">disco virtual de destino.</text><text x="66" y="458" font-size="22" fill="#475569" font-weight="400">Identifica qué se va a escribir.</text><path d="M404 351h12m-6 -6 6 6-6 6" fill="none" stroke="#64748b" stroke-width="3"/><rect x="422" y="186" width="356" height="336" rx="18" fill="white" stroke="#cbd5e1"/><rect x="422" y="186" width="356" height="8" rx="4" fill="#0d9488"/><circle cx="462" cy="234" r="21" fill="#0d9488"/><text x="455" y="242" font-size="21" fill="white" font-weight="700">2</text><text x="446" y="294" font-size="29" fill="#0f172a" font-weight="700">Instalar</text><text x="446" y="333" font-size="21" fill="#0d9488" font-weight="400">Leer cada decisión</text><text x="446" y="394" font-size="22" fill="#475569" font-weight="400">El entorno Live y el sistema</text><text x="446" y="426" font-size="22" fill="#475569" font-weight="400">instalado pueden mostrar</text><text x="446" y="458" font-size="22" fill="#475569" font-weight="400">escritorios parecidos.</text><path d="M784 351h12m-6 -6 6 6-6 6" fill="none" stroke="#64748b" stroke-width="3"/><rect x="802" y="186" width="356" height="336" rx="18" fill="white" stroke="#cbd5e1"/><rect x="802" y="186" width="356" height="8" rx="4" fill="#7c3aed"/><circle cx="842" cy="234" r="21" fill="#7c3aed"/><text x="835" y="242" font-size="21" fill="white" font-weight="700">3</text><text x="826" y="294" font-size="29" fill="#0f172a" font-weight="700">Comprobar</text><text x="826" y="333" font-size="21" fill="#7c3aed" font-weight="400">Arranque y persistencia</text><text x="826" y="394" font-size="22" fill="#475569" font-weight="400">Tras instalar, apaga, retira la</text><text x="826" y="426" font-size="22" fill="#475569" font-weight="400">ISO y arranca desde el disco.</text><text x="826" y="458" font-size="22" fill="#475569" font-weight="400">Comprueba tus datos.</text><rect x="42" y="554" width="1116" height="96" rx="14" fill="#0f172a"/><text x="64" y="590" font-size="25" fill="#a5f3fc" font-weight="650">La instalación se acepta con pruebas</text><text x="64" y="624" font-size="20" fill="#ffffff" font-weight="400">El escritorio por sí solo no identifica el medio desde el que se ha arrancado.</text></g></svg>