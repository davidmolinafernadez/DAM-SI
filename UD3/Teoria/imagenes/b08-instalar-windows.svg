<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Windows: preparar, instalar, revisar</title><desc id="desc">Compatibilidad. Sistema y hardware virtual. Revisa arquitectura, edición, recursos y firmware. Utiliza un entorno compatible.. Instalación. Destino y configuración. Confirma el disco virtual y las opciones de cuenta, idioma y configuración.. Aceptación. Comprobar el equipo. Revisa versión, dispositivos, actualizaciones y estado de activación por separado.. Llegar al escritorio no termina la revisión. Documenta incidencias y verifica el funcionamiento después del reinicio.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect width="1200" height="680" rx="24" fill="#f1f5f9"/><path d="M24 0H1176Q1200 0 1200 24V156H0V24Q0 0 24 0" fill="#0f172a"/><text x="42" y="44" font-size="17" fill="#67e8f9" font-weight="600">SISTEMAS INFORMÁTICOS  /  UD3  /  3.3.2</text><text x="42" y="105" font-size="38" fill="#ffffff" font-weight="700">Windows: preparar, instalar, revisar</text><rect x="42" y="186" width="356" height="336" rx="18" fill="white" stroke="#cbd5e1"/><rect x="42" y="186" width="356" height="8" rx="4" fill="#0284c7"/><circle cx="82" cy="234" r="21" fill="#0284c7"/><text x="75" y="242" font-size="21" fill="white" font-weight="700">1</text><text x="66" y="294" font-size="29" fill="#0f172a" font-weight="700">Compatibilidad</text><text x="66" y="333" font-size="21" fill="#0284c7" font-weight="400">Sistema y hardware virtual</text><text x="66" y="394" font-size="22" fill="#475569" font-weight="400">Revisa arquitectura, edición,</text><text x="66" y="426" font-size="22" fill="#475569" font-weight="400">recursos y firmware. Utiliza un</text><text x="66" y="458" font-size="22" fill="#475569" font-weight="400">entorno compatible.</text><path d="M404 351h12m-6 -6 6 6-6 6" fill="none" stroke="#64748b" stroke-width="3"/><rect x="422" y="186" width="356" height="336" rx="18" fill="white" stroke="#cbd5e1"/><rect x="422" y="186" width="356" height="8" rx="4" fill="#0d9488"/><circle cx="462" cy="234" r="21" fill="#0d9488"/><text x="455" y="242" font-size="21" fill="white" font-weight="700">2</text><text x="446" y="294" font-size="29" fill="#0f172a" font-weight="700">Instalación</text><text x="446" y="333" font-size="21" fill="#0d9488" font-weight="400">Destino y configuración</text><text x="446" y="394" font-size="22" fill="#475569" font-weight="400">Confirma el disco virtual y las</text><text x="446" y="426" font-size="22" fill="#475569" font-weight="400">opciones de cuenta, idioma y</text><text x="446" y="458" font-size="22" fill="#475569" font-weight="400">configuración.</text><path d="M784 351h12m-6 -6 6 6-6 6" fill="none" stroke="#64748b" stroke-width="3"/><rect x="802" y="186" width="356" height="336" rx="18" fill="white" stroke="#cbd5e1"/><rect x="802" y="186" width="356" height="8" rx="4" fill="#7c3aed"/><circle cx="842" cy="234" r="21" fill="#7c3aed"/><text x="835" y="242" font-size="21" fill="white" font-weight="700">3</text><text x="826" y="294" font-size="29" fill="#0f172a" font-weight="700">Aceptación</text><text x="826" y="333" font-size="21" fill="#7c3aed" font-weight="400">Comprobar el equipo</text><text x="826" y="394" font-size="22" fill="#475569" font-weight="400">Revisa versión, dispositivos,</text><text x="826" y="426" font-size="22" fill="#475569" font-weight="400">actualizaciones y estado de</text><text x="826" y="458" font-size="22" fill="#475569" font-weight="400">activación por separado.</text><rect x="42" y="554" width="1116" height="96" rx="14" fill="#0f172a"/><text x="64" y="590" font-size="25" fill="#a5f3fc" font-weight="650">Llegar al escritorio no termina la revisión</text><text x="64" y="624" font-size="20" fill="#ffffff" font-weight="400">Documenta incidencias y verifica el funcionamiento después del reinicio.</text></g></svg>