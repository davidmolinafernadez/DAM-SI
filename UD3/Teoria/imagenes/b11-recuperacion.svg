<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Cada copia cubre un problema distinto</title><desc id="desc">Instantánea. Volver a un estado. Permite regresar a un punto de la VM. Depende de conservar su cadena de archivos.. Clon o exportación. Duplicar o transferir. Un clon completo separa discos del origen; una exportación facilita el intercambio.. Respaldo independiente. Cubrir la pérdida del soporte. Guarda una copia en otro destino y prueba que puedes restaurarla.. Dos copias en el mismo SSD comparten el riesgo físico. Elige la operación según el fallo que necesitas cubrir y verifica el retorno.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect width="1200" height="680" rx="24" fill="#f1f5f9"/><path d="M24 0H1176Q1200 0 1200 24V156H0V24Q0 0 24 0" fill="#0f172a"/><text x="42" y="44" font-size="17" fill="#67e8f9" font-weight="600">SISTEMAS INFORMÁTICOS  /  UD3  /  3.7</text><text x="42" y="105" font-size="38" fill="#ffffff" font-weight="700">Cada copia cubre un problema distinto</text><rect x="42" y="186" width="356" height="336" rx="18" fill="white" stroke="#cbd5e1"/><rect x="42" y="186" width="356" height="8" rx="4" fill="#0284c7"/><circle cx="82" cy="234" r="21" fill="#0284c7"/><text x="75" y="242" font-size="21" fill="white" font-weight="700">1</text><text x="66" y="294" font-size="29" fill="#0f172a" font-weight="700">Instantánea</text><text x="66" y="333" font-size="21" fill="#0284c7" font-weight="400">Volver a un estado</text><text x="66" y="394" font-size="22" fill="#475569" font-weight="400">Permite regresar a un punto de</text><text x="66" y="426" font-size="22" fill="#475569" font-weight="400">la VM. Depende de conservar</text><text x="66" y="458" font-size="22" fill="#475569" font-weight="400">su cadena de archivos.</text><rect x="422" y="186" width="356" height="336" rx="18" fill="white" stroke="#cbd5e1"/><rect x="422" y="186" width="356" height="8" rx="4" fill="#0d9488"/><circle cx="462" cy="234" r="21" fill="#0d9488"/><text x="455" y="242" font-size="21" fill="white" font-weight="700">2</text><text x="446" y="294" font-size="29" fill="#0f172a" font-weight="700">Clon o exportación</text><text x="446" y="333" font-size="21" fill="#0d9488" font-weight="400">Duplicar o transferir</text><text x="446" y="394" font-size="22" fill="#475569" font-weight="400">Un clon completo separa discos</text><text x="446" y="426" font-size="22" fill="#475569" font-weight="400">del origen; una exportación</text><text x="446" y="458" font-size="22" fill="#475569" font-weight="400">facilita el intercambio.</text><rect x="802" y="186" width="356" height="336" rx="18" fill="white" stroke="#cbd5e1"/><rect x="802" y="186" width="356" height="8" rx="4" fill="#7c3aed"/><circle cx="842" cy="234" r="21" fill="#7c3aed"/><text x="835" y="242" font-size="21" fill="white" font-weight="700">3</text><text x="826" y="294" font-size="29" fill="#0f172a" font-weight="700">Respaldo independiente</text><text x="826" y="333" font-size="21" fill="#7c3aed" font-weight="400">Cubrir la pérdida del soporte</text><text x="826" y="394" font-size="22" fill="#475569" font-weight="400">Guarda una copia en otro</text><text x="826" y="426" font-size="22" fill="#475569" font-weight="400">destino y prueba que puedes</text><text x="826" y="458" font-size="22" fill="#475569" font-weight="400">restaurarla.</text><rect x="42" y="554" width="1116" height="96" rx="14" fill="#0f172a"/><text x="64" y="590" font-size="25" fill="#a5f3fc" font-weight="650">Dos copias en el mismo SSD comparten el riesgo físico</text><text x="64" y="624" font-size="20" fill="#ffffff" font-weight="400">Elige la operación según el fallo que necesitas cubrir y verifica el retorno.</text></g></svg>