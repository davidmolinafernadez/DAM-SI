<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Asignar recursos exige dejar margen</title><desc id="desc">CPU. vCPU para el invitado. La ejecución compite con las aplicaciones del anfitrión. Más vCPU no siempre mejora.. RAM. Memoria durante el uso. Reserva memoria para el anfitrión y un margen. Mide con la carga real.. Disco. Capacidad y ocupación. Un VDI dinámico ocupa menos al principio, pero necesita espacio físico para crecer.. Capacidad configurada ≠ recursos disponibles. Incluye también instantáneas, copias y espacio temporal en la previsión.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect width="1200" height="680" rx="24" fill="#f1f5f9"/><path d="M24 0H1176Q1200 0 1200 24V156H0V24Q0 0 24 0" fill="#0f172a"/><text x="42" y="44" font-size="17" fill="#67e8f9" font-weight="600">SISTEMAS INFORMÁTICOS  /  UD3  /  3.2.2</text><text x="42" y="105" font-size="38" fill="#ffffff" font-weight="700">Asignar recursos exige dejar margen</text><rect x="42" y="186" width="356" height="336" rx="18" fill="white" stroke="#cbd5e1"/><rect x="42" y="186" width="356" height="8" rx="4" fill="#0284c7"/><circle cx="82" cy="234" r="21" fill="#0284c7"/><text x="75" y="242" font-size="21" fill="white" font-weight="700">1</text><text x="66" y="294" font-size="29" fill="#0f172a" font-weight="700">CPU</text><text x="66" y="333" font-size="21" fill="#0284c7" font-weight="400">vCPU para el invitado</text><text x="66" y="394" font-size="22" fill="#475569" font-weight="400">La ejecución compite con las</text><text x="66" y="426" font-size="22" fill="#475569" font-weight="400">aplicaciones del anfitrión. Más</text><text x="66" y="458" font-size="22" fill="#475569" font-weight="400">vCPU no siempre mejora.</text><rect x="422" y="186" width="356" height="336" rx="18" fill="white" stroke="#cbd5e1"/><rect x="422" y="186" width="356" height="8" rx="4" fill="#0d9488"/><circle cx="462" cy="234" r="21" fill="#0d9488"/><text x="455" y="242" font-size="21" fill="white" font-weight="700">2</text><text x="446" y="294" font-size="29" fill="#0f172a" font-weight="700">RAM</text><text x="446" y="333" font-size="21" fill="#0d9488" font-weight="400">Memoria durante el uso</text><text x="446" y="394" font-size="22" fill="#475569" font-weight="400">Reserva memoria para el</text><text x="446" y="426" font-size="22" fill="#475569" font-weight="400">anfitrión y un margen. Mide</text><text x="446" y="458" font-size="22" fill="#475569" font-weight="400">con la carga real.</text><rect x="802" y="186" width="356" height="336" rx="18" fill="white" stroke="#cbd5e1"/><rect x="802" y="186" width="356" height="8" rx="4" fill="#7c3aed"/><circle cx="842" cy="234" r="21" fill="#7c3aed"/><text x="835" y="242" font-size="21" fill="white" font-weight="700">3</text><text x="826" y="294" font-size="29" fill="#0f172a" font-weight="700">Disco</text><text x="826" y="333" font-size="21" fill="#7c3aed" font-weight="400">Capacidad y ocupación</text><text x="826" y="394" font-size="22" fill="#475569" font-weight="400">Un VDI dinámico ocupa menos</text><text x="826" y="426" font-size="22" fill="#475569" font-weight="400">al principio, pero necesita</text><text x="826" y="458" font-size="22" fill="#475569" font-weight="400">espacio físico para crecer.</text><rect x="42" y="554" width="1116" height="96" rx="14" fill="#0f172a"/><text x="64" y="590" font-size="25" fill="#a5f3fc" font-weight="650">Capacidad configurada ≠ recursos disponibles</text><text x="64" y="624" font-size="20" fill="#ffffff" font-weight="400">Incluye también instantáneas, copias y espacio temporal en la previsión.</text></g></svg>