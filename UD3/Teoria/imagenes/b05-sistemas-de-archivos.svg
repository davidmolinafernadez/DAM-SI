<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Dispositivo, formato y montaje</title><desc id="desc">Disco y particiones. Dónde se reserva espacio. El disco se organiza en regiones. La tabla registra las particiones.. Sistema de archivos. Cómo se organizan los datos. ext4, NTFS o FAT32 gestionan archivos y metadatos según su función.. Punto de montaje. Por dónde se accede. En Linux se incorpora un sistema de archivos a una ruta como / o /home.. Detectar un disco no significa tenerlo montado. lsblk muestra dispositivos; df informa sobre sistemas de archivos montados.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect width="1200" height="680" rx="24" fill="#f1f5f9"/><path d="M24 0H1176Q1200 0 1200 24V156H0V24Q0 0 24 0" fill="#0f172a"/><text x="42" y="44" font-size="17" fill="#67e8f9" font-weight="600">SISTEMAS INFORMÁTICOS  /  UD3  /  3.4</text><text x="42" y="105" font-size="38" fill="#ffffff" font-weight="700">Dispositivo, formato y montaje</text><rect x="42" y="186" width="356" height="336" rx="18" fill="white" stroke="#cbd5e1"/><rect x="42" y="186" width="356" height="8" rx="4" fill="#0284c7"/><circle cx="82" cy="234" r="21" fill="#0284c7"/><text x="75" y="242" font-size="21" fill="white" font-weight="700">1</text><text x="66" y="294" font-size="29" fill="#0f172a" font-weight="700">Disco y particiones</text><text x="66" y="333" font-size="21" fill="#0284c7" font-weight="400">Dónde se reserva espacio</text><text x="66" y="394" font-size="22" fill="#475569" font-weight="400">El disco se organiza en</text><text x="66" y="426" font-size="22" fill="#475569" font-weight="400">regiones. La tabla registra las</text><text x="66" y="458" font-size="22" fill="#475569" font-weight="400">particiones.</text><path d="M404 351h12m-6 -6 6 6-6 6" fill="none" stroke="#64748b" stroke-width="3"/><rect x="422" y="186" width="356" height="336" rx="18" fill="white" stroke="#cbd5e1"/><rect x="422" y="186" width="356" height="8" rx="4" fill="#0d9488"/><circle cx="462" cy="234" r="21" fill="#0d9488"/><text x="455" y="242" font-size="21" fill="white" font-weight="700">2</text><text x="446" y="294" font-size="29" fill="#0f172a" font-weight="700">Sistema de archivos</text><text x="446" y="333" font-size="21" fill="#0d9488" font-weight="400">Cómo se organizan los datos</text><text x="446" y="394" font-size="22" fill="#475569" font-weight="400">ext4, NTFS o FAT32 gestionan</text><text x="446" y="426" font-size="22" fill="#475569" font-weight="400">archivos y metadatos según su</text><text x="446" y="458" font-size="22" fill="#475569" font-weight="400">función.</text><path d="M784 351h12m-6 -6 6 6-6 6" fill="none" stroke="#64748b" stroke-width="3"/><rect x="802" y="186" width="356" height="336" rx="18" fill="white" stroke="#cbd5e1"/><rect x="802" y="186" width="356" height="8" rx="4" fill="#7c3aed"/><circle cx="842" cy="234" r="21" fill="#7c3aed"/><text x="835" y="242" font-size="21" fill="white" font-weight="700">3</text><text x="826" y="294" font-size="29" fill="#0f172a" font-weight="700">Punto de montaje</text><text x="826" y="333" font-size="21" fill="#7c3aed" font-weight="400">Por dónde se accede</text><text x="826" y="394" font-size="22" fill="#475569" font-weight="400">En Linux se incorpora un</text><text x="826" y="426" font-size="22" fill="#475569" font-weight="400">sistema de archivos a una ruta</text><text x="826" y="458" font-size="22" fill="#475569" font-weight="400">como / o /home.</text><rect x="42" y="554" width="1116" height="96" rx="14" fill="#0f172a"/><text x="64" y="590" font-size="25" fill="#a5f3fc" font-weight="650">Detectar un disco no significa tenerlo montado</text><text x="64" y="624" font-size="20" fill="#ffffff" font-weight="400">lsblk muestra dispositivos; df informa sobre sistemas de archivos montados.</text></g></svg>