name: Publicar web docente

on:
  push:
    branches: [main]
    paths:
      - "UD*/Teoria/**"
      - "web/**"
      - "scripts/prepare_site.py"
      - "mkdocs.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar el generador web
        run: pip install "mkdocs-material==9.6.16"

      - name: Preparar solo la teoría
        run: python scripts/prepare_site.py

      - name: Construir la web
        run: mkdocs build --strict

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar la web
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
